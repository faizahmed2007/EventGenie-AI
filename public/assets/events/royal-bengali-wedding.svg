<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#022C22" />
      <stop offset="50%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <radialGradient id="chandelierGlow" cx="50%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#D4AF65" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#022C22" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldArch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D4AF65" />
      <stop offset="100%" stop-color="#92702A" />
    </linearGradient>
    <linearGradient id="ivoryFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Base Emerald Dusk Sky & Courtyard -->
  <rect width="960" height="540" fill="url(#bgEmerald)" />
  <rect width="960" height="540" fill="url(#chandelierGlow)" />

  <!-- Subtle Architectural Colonade Grid -->
  <g stroke="#D4AF65" stroke-opacity="0.16" stroke-width="1">
    <line x1="0" y1="410" x2="960" y2="410" />
    <line x1="0" y1="455" x2="960" y2="455" />
    <line x1="0" y1="505" x2="960" y2="505" />
  </g>

  <!-- Left & Right Heritage Rajbari Cusped Arches -->
  <path d="M 55 430 L 55 165 Q 175 65 295 165 L 295 430 Z" fill="#064E3B" fill-opacity="0.7" stroke="url(#goldArch)" stroke-width="2" />
  <path d="M 80 430 L 80 185 Q 175 98 270 185 L 270 430 Z" fill="#022C22" fill-opacity="0.55" stroke="#D4AF65" stroke-opacity="0.4" stroke-width="1.2" />

  <path d="M 665 430 L 665 165 Q 785 65 905 165 L 905 430 Z" fill="#064E3B" fill-opacity="0.7" stroke="url(#goldArch)" stroke-width="2" />
  <path d="M 690 430 L 690 185 Q 785 98 880 185 L 880 430 Z" fill="#022C22" fill-opacity="0.55" stroke="#D4AF65" stroke-opacity="0.4" stroke-width="1.2" />

  <!-- Grand Central Mandap Archway -->
  <path d="M 275 430 L 275 130 Q 480 15 685 130 L 685 430 Z" fill="#065F46" fill-opacity="0.85" stroke="url(#goldArch)" stroke-width="3" />
  <path d="M 305 430 L 305 150 Q 480 48 655 150 L 655 430 Z" fill="#022C22" fill-opacity="0.65" stroke="#FDE68A" stroke-opacity="0.55" stroke-width="1.5" />

  <!-- Cascading Rajnigandha (Tuberose) & Marigold Garlands -->
  <g stroke="#FAF8F2" stroke-width="2.2" stroke-dasharray="3 6" opacity="0.88">
    <line x1="125" y1="20" x2="125" y2="195" />
    <line x1="175" y1="15" x2="175" y2="165" />
    <line x1="225" y1="20" x2="225" y2="205" />
    <line x1="335" y1="10" x2="335" y2="180" />
    <line x1="385" y1="10" x2="385" y2="145" />
    <line x1="435" y1="10" x2="435" y2="165" />
    <line x1="480" y1="8" x2="480" y2="135" />
    <line x1="525" y1="10" x2="525" y2="165" />
    <line x1="575" y1="10" x2="575" y2="145" />
    <line x1="625" y1="10" x2="625" y2="180" />
    <line x1="735" y1="20" x2="735" y2="205" />
    <line x1="785" y1="15" x2="785" y2="165" />
    <line x1="835" y1="20" x2="835" y2="195" />
  </g>

  <!-- Brass Temple Bells & Marigold Tassels -->
  <g fill="#D4AF65">
    <circle cx="125" cy="202" r="5.5" />
    <circle cx="175" cy="172" r="6.5" fill="#FDE68A" />
    <circle cx="225" cy="212" r="5.5" />
    <circle cx="335" cy="187" r="6" />
    <circle cx="385" cy="152" r="5.5" fill="#FDE68A" />
    <circle cx="435" cy="172" r="6" />
    <circle cx="480" cy="142" r="9" fill="#FDE68A" />
    <circle cx="525" cy="172" r="6" />
    <circle cx="575" cy="152" r="5.5" fill="#FDE68A" />
    <circle cx="625" cy="187" r="6" />
    <circle cx="735" cy="212" r="5.5" />
    <circle cx="785" cy="172" r="6.5" fill="#FDE68A" />
    <circle cx="835" cy="202" r="5.5" />
  </g>

  <!-- Central Grand Chandelier -->
  <g transform="translate(480, 115)">
    <circle cx="0" cy="0" r="36" fill="#FDE68A" fill-opacity="0.22" />
    <path d="M -38 8 Q 0 28 38 8" fill="none" stroke="#FDE68A" stroke-width="2.5" />
    <path d="M -26 -4 Q 0 12 26 -4" fill="none" stroke="#D4AF65" stroke-width="2" />
    <circle cx="-28" cy="4" r="3.5" fill="#FAF8F2" />
    <circle cx="-14" cy="10" r="4" fill="#FAF8F2" />
    <circle cx="0" cy="12" r="5" fill="#FDE68A" />
    <circle cx="14" cy="10" r="4" fill="#FAF8F2" />
    <circle cx="28" cy="4" r="3.5" fill="#FAF8F2" />
  </g>

  <!-- Reflecting Courtyard Floor -->
  <rect x="0" y="410" width="960" height="130" fill="url(#ivoryFloor)" />

  <!-- Elevated Reception Stage & Ivory Settee -->
  <rect x="310" y="375" width="340" height="42" rx="6" fill="#064E3B" stroke="url(#goldArch)" stroke-width="2" />
  <rect x="335" y="388" width="290" height="36" rx="4" fill="#D4AF65" fill-opacity="0.22" stroke="#D4AF65" stroke-width="1.2" />
  <!-- Royal Reception Sofa -->
  <rect x="385" y="305" width="190" height="72" rx="18" fill="#FAF8F2" stroke="url(#goldArch)" stroke-width="3" />
  <rect x="372" y="335" width="24" height="42" rx="8" fill="#FAF8F2" stroke="#D4AF65" stroke-width="2" />
  <rect x="564" y="335" width="24" height="42" rx="8" fill="#FAF8F2" stroke="#D4AF65" stroke-width="2" />
  <!-- Stage Floral Urns -->
  <g fill="#D4AF65">
    <ellipse cx="338" cy="348" rx="16" ry="24" fill="#047857" stroke="#D4AF65" stroke-width="2" />
    <circle cx="330" cy="326" r="8" fill="#FAF8F2" />
    <circle cx="344" cy="322" r="9" fill="#FDE68A" />
    <circle cx="338" cy="334" r="7" fill="#FAF8F2" />

    <ellipse cx="622" cy="348" rx="16" ry="24" fill="#047857" stroke="#D4AF65" stroke-width="2" />
    <circle cx="614" cy="326" r="8" fill="#FAF8F2" />
    <circle cx="628" cy="322" r="9" fill="#FDE68A" />
    <circle cx="622" cy="334" r="7" fill="#FAF8F2" />
  </g>

  <!-- Candlelit Banquet Tables Left & Right -->
  <g>
    <ellipse cx="165" cy="448" rx="75" ry="22" fill="#FAF8F2" fill-opacity="0.92" stroke="#D4AF65" stroke-width="2" />
    <circle cx="145" cy="442" r="4" fill="#D4AF65" />
    <circle cx="165" cy="438" r="6" fill="#FDE68A" />
    <circle cx="185" cy="442" r="4" fill="#D4AF65" />

    <ellipse cx="795" cy="448" rx="75" ry="22" fill="#FAF8F2" fill-opacity="0.92" stroke="#D4AF65" stroke-width="2" />
    <circle cx="775" cy="442" r="4" fill="#D4AF65" />
    <circle cx="795" cy="438" r="6" fill="#FDE68A" />
    <circle cx="815" cy="442" r="4" fill="#D4AF65" />
  </g>
</svg>
