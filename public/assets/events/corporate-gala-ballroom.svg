<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="galaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#galaBg)" />

  <!-- Geometric Art-Deco Gold Wall Panels -->
  <g stroke="#D4AF65" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <rect x="70" y="60" width="180" height="320" rx="8" />
    <rect x="90" y="80" width="140" height="280" rx="4" />
    <rect x="290" y="50" width="380" height="330" rx="12" />
    <rect x="315" y="75" width="330" height="280" rx="8" />
    <rect x="710" y="60" width="180" height="320" rx="8" />
    <rect x="730" y="80" width="140" height="280" rx="4" />
  </g>

  <!-- Three Geometric Champagne Gold Chandeliers -->
  <g fill="#FDE68A" stroke="#D4AF65" stroke-width="2">
    <circle cx="160" cy="145" r="22" fill-opacity="0.35" />
    <circle cx="480" cy="130" r="34" fill-opacity="0.45" />
    <circle cx="800" cy="145" r="22" fill-opacity="0.35" />
  </g>

  <!-- Gala Round Banquet Tables -->
  <ellipse cx="230" cy="445" rx="95" ry="26" fill="#FAF8F2" stroke="#D4AF65" stroke-width="2" />
  <ellipse cx="480" cy="460" rx="110" ry="30" fill="#FAF8F2" stroke="#D4AF65" stroke-width="2.5" />
  <ellipse cx="730" cy="445" rx="95" ry="26" fill="#FAF8F2" stroke="#D4AF65" stroke-width="2" />
</svg>
