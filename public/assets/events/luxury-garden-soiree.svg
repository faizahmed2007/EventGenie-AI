  <rect x="230" y="402" width="500" height="12" rx="4" fill="#D4AF65" fill-opacity="0.35" />

  <!-- Brass Candle Lanterns & Botanical Centerpieces Along Table -->
  <g>
    <rect x="285" y="352" width="22" height="33" rx="4" fill="#D4AF65" />
    <circle cx="296" cy="368" r="5" fill="#FAF8F2" />
    <rect x="469" y="344" width="26" height="41" rx="5" fill="#D4AF65" />
