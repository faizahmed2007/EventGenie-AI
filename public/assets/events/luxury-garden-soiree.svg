  <path d="M 320 420 L 320 190 Q 480 90 640 190 L 640 420 Z" fill="#065F46" fill-opacity="0.55" stroke="#D4AF65" stroke-width="2.5" />
  <line x1="480" y1="140" x2="480" y2="420" stroke="#D4AF65" stroke-width="1.5" opacity="0.5" />
  <line x1="320" y1="280" x2="640" y2="280" stroke="#D4AF65" stroke-width="1.5" opacity="0.5" />

