    <ellipse cx="210" cy="360" rx="85" ry="130" />
    <ellipse cx="760" cy="360" rx="85" ry="130" />
    <ellipse cx="870" cy="340" rx="95" ry="160" />
  </g>

  <!-- Overhead Pergola & Fairy Bistro String Lights -->
  <path d="M 60 80 Q 480 155 900 80" fill="none" stroke="#D4AF65" stroke-width="1.8" opacity="0.8" />
  <path d="M 60 130 Q 480 200 900 130" fill="none" stroke="#D4AF65" stroke-width="1.5" opacity="0.7" />

  <g fill="#FDE68A">
    <circle cx="150" cy="96" r="5" />
    <circle cx="240" cy="108" r="5.5" />
    <circle cx="330" cy="116" r="6" />
    <circle cx="420" cy="121" r="6.5" />
    <circle cx="480" cy="122" r="7" />
    <circle cx="540" cy="121" r="6.5" />
    <circle cx="630" cy="116" r="6" />
    <circle cx="720" cy="108" r="5.5" />
    <circle cx="810" cy="96" r="5" />

    <circle cx="190" cy="148" r="4.5" />
    <circle cx="290" cy="158" r="5" />
    <circle cx="390" cy="165" r="5.5" />
    <circle cx="480" cy="167" r="6" />
    <circle cx="570" cy="165" r="5.5" />
    <circle cx="670" cy="158" r="5" />
    <circle cx="770" cy="148" r="4.5" />
