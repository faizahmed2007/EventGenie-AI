<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="gardenSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#022C22" />
      <stop offset="60%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <radialGradient id="bistroWarmth" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#D4AF65" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#022C22" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="960" height="540" fill="url(#gardenSky)" />
  <rect width="960" height="540" fill="url(#bistroWarmth)" />

  <!-- Botanical Silhouettes & Cypress Foliage -->
  <g fill="#022C22" opacity="0.65">
